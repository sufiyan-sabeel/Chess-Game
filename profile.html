<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Profile - CheckMate Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        .btn-secondary { background-color: #4a5568; color: #e2e8f0; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #2d3748; }
        .card { background-color: #2d3748; border: 1px solid #4a5568; }
    </style>
</head>
<body class="antialiased min-h-screen">
    <nav class="bg-gray-900 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white tracking-wider">
                <i class="fa-solid fa-chess"></i> CheckMate Web
            </a>
            <div>
                <a href="index.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Home</a>
                <a href="#" onclick="Auth.logout(); window.location.href='login.html';" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-bold">Profile: <span id="profile-username"></span></h1>
                <a href="#" onclick="Auth.logout(); window.location.href='login.html';" class="btn-secondary font-bold py-2 px-4 rounded-md">
                    <i class="fa-solid fa-sign-out-alt mr-2"></i>Logout
                </a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="card p-6 rounded-lg text-center">
                    <h2 id="stat-wins" class="text-4xl font-bold text-green-400">0</h2>
                    <p class="text-gray-400">Wins</p>
                </div>
                <div class="card p-6 rounded-lg text-center">
                    <h2 id="stat-losses" class="text-4xl font-bold text-red-400">0</h2>
                    <p class="text-gray-400">Losses</p>
                </div>
                <div class="card p-6 rounded-lg text-center">
                    <h2 id="stat-draws" class="text-4xl font-bold text-yellow-400">0</h2>
                    <p class="text-gray-400">Draws</p>
                </div>
            </div>

            <div class="card p-6 rounded-lg">
                <h2 class="text-2xl font-bold mb-4">Recent Game History</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="border-b border-gray-600">
                            <tr>
                                <th class="py-2 px-4">Opponent</th>
                                <th class="py-2 px-4">Result</th>
                                <th class="py-2 px-4">Date</th>
                            </tr>
                        </thead>
                        <tbody id="game-history-body">
                            <tr><td colspan="3" class="text-center py-6 text-gray-500">No games played yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!Auth.requireAuth()) throw 'Not logged in';

        document.getElementById('profile-username').textContent = Auth.currentUser.username;
        const stats = DB.getUserStats(Auth.currentUser.id);
        document.getElementById('stat-wins').textContent = stats.win;
        document.getElementById('stat-losses').textContent = stats.loss;
        document.getElementById('stat-draws').textContent = stats.draw;

        const games = DB.getUserGames(Auth.currentUser.id);
        const tbody = document.getElementById('game-history-body');
        if (games.length > 0) {
            tbody.innerHTML = games.map(g => `
                <tr class="border-b border-gray-700 hover:bg-gray-800">
                    <td class="py-3 px-4 capitalize">${g.opponent_type === 'ai' ? 'Robot' : 'Human'}</td>
                    <td class="py-3 px-4 capitalize font-semibold ${
                        g.result === 'win' ? 'text-green-400' : g.result === 'loss' ? 'text-red-400' : 'text-yellow-400'
                    }">${g.result}</td>
                    <td class="py-3 px-4 text-gray-400">${new Date(g.played_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
