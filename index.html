<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
        }
        .card {
            background-color: #2d3748;
            border: 1px solid #4a5568;
        }
        .card:hover {
            border-color: #63b3ed;
        }
    </style>
</head>
<body class="antialiased min-h-screen">
    <nav class="bg-gray-900 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white tracking-wider">
                <i class="fa-solid fa-chess"></i> Chess Game
            </a>
            <div>
                <span class="text-gray-400 text-sm">Free Online Chess</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        <div class="text-center">
            <h1 class="text-4xl font-bold mb-4">Welcome to Chess Game</h1>
            <p class="text-lg text-gray-400 mb-8">Choose a game mode to start playing.</p>

            <div class="flex flex-col md:flex-row justify-center items-center gap-6">
                <a href="game.html?mode=ai" class="w-full md:w-1/3 card p-8 rounded-lg shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300">
                    <div class="text-6xl text-green-400 mb-4">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">Play vs. Computer</h2>
                    <p class="text-gray-400">Challenge the AI opponent. Good luck!</p>
                </a>

                <a href="game.html?mode=hotseat" class="w-full md:w-1/3 card p-8 rounded-lg shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300">
                    <div class="text-6xl text-blue-400 mb-4">
                        <i class="fa-solid fa-user-friends"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">Play vs. Human</h2>
                    <p class="text-gray-400">Play against a friend on the same device.</p>
                </a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.body.style.userSelect = 'none';
            document.body.style.webkitUserSelect = 'none';
            window.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
