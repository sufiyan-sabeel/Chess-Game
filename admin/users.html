<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - CheckMate Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        .sidebar { background-color: #2d3748; }
        .sidebar a { color: #a0aec0; border-left: 3px solid transparent; }
        .sidebar a:hover { background-color: #4a5568; color: #ffffff; }
        .sidebar a.active { border-left-color: #63b3ed; color: #ffffff; background-color: #4a5568; }
        .card { background-color: #2d3748; }
    </style>
</head>
<body class="flex h-screen">
    <aside class="w-64 sidebar shadow-lg flex-shrink-0">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-white"><i class="fa-solid fa-shield-halved"></i> Admin</h1>
        </div>
        <nav class="mt-6">
            <a href="index.html" class="block py-3 px-6 transition duration-200">
                <i class="fa-solid fa-tachometer-alt w-6 mr-2"></i> Dashboard
            </a>
            <a href="users.html" class="block py-3 px-6 transition duration-200 active">
                <i class="fa-solid fa-users w-6 mr-2"></i> Users
            </a>
            <a href="#" onclick="localStorage.removeItem('chess_admin_session'); window.location.href='login.html';" class="block py-3 px-6 transition duration-200">
                <i class="fa-solid fa-sign-out-alt w-6 mr-2"></i> Logout
            </a>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold mb-6">Manage Users</h1>
        <div class="card rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="py-3 px-5 font-semibold">Username</th>
                            <th class="py-3 px-5 font-semibold">Email</th>
                            <th class="py-3 px-5 font-semibold">Joined At</th>
                            <th class="py-3 px-5 font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="js/db.js"></script>
    <script>
        if (!localStorage.getItem('chess_admin_session')) { window.location.href = 'login.html'; throw 'Not admin'; }

        function renderUsers() {
            const users = DB.getUsers();
            const tbody = document.getElementById('users-tbody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-gray-500">No users found.</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td class="py-3 px-5">${u.username}</td>
                    <td class="py-3 px-5">${u.email}</td>
                    <td class="py-3 px-5 text-gray-400">${new Date(u.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                    <td class="py-3 px-5">
                        <button onclick="deleteUser(${u.id})" class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-1 px-3 rounded-md">
                            <i class="fa-solid fa-trash-alt"></i> Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user and all their games?')) {
                DB.deleteUser(id);
                renderUsers();
            }
        }

        renderUsers();
    </script>
</body>
</html>
