<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Admin Dashboard - CheckMate Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        .sidebar { background-color: #2d3748; }
        .sidebar a { color: #a0aec0; border-left: 3px solid transparent; }
        .sidebar a:hover { background-color: #4a5568; color: #ffffff; }
        .sidebar a.active { border-left-color: #63b3ed; color: #ffffff; background-color: #4a5568; }
        .card { background-color: #2d3748; }
    </style>
</head>
<body class="flex h-screen">
    <aside class="w-64 sidebar shadow-lg flex-shrink-0">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-white"><i class="fa-solid fa-shield-halved"></i> Admin</h1>
        </div>
        <nav class="mt-6">
            <a href="index.html" class="block py-3 px-6 transition duration-200 active">
                <i class="fa-solid fa-tachometer-alt w-6 mr-2"></i> Dashboard
            </a>
            <a href="users.html" class="block py-3 px-6 transition duration-200">
                <i class="fa-solid fa-users w-6 mr-2"></i> Users
            </a>
            <a href="#" onclick="localStorage.removeItem('chess_admin_session'); window.location.href='login.html';" class="block py-3 px-6 transition duration-200">
                <i class="fa-solid fa-sign-out-alt w-6 mr-2"></i> Logout
            </a>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold mb-6">Dashboard</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="stats-grid"></div>
    </main>
    <script src="js/db.js"></script>
    <script>
        if (!localStorage.getItem('chess_admin_session')) { window.location.href = 'login.html'; throw 'Not admin'; }
        const stats = DB.getTotalStats();
        document.getElementById('stats-grid').innerHTML = `
            <div class="card p-6 rounded-lg shadow-md flex items-center">
                <div class="bg-blue-500 p-4 rounded-full mr-4"><i class="fa-solid fa-users text-2xl text-white"></i></div>
                <div><p class="text-gray-400 text-sm">Total Registered Users</p><p class="text-3xl font-bold">${stats.users}</p></div>
            </div>
            <div class="card p-6 rounded-lg shadow-md flex items-center">
                <div class="bg-green-500 p-4 rounded-full mr-4"><i class="fa-solid fa-chess-board text-2xl text-white"></i></div>
                <div><p class="text-gray-400 text-sm">Total Games Played</p><p class="text-3xl font-bold">${stats.games}</p></div>
            </div>
        `;
    </script>
</body>
</html>
