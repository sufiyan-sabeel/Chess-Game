<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Chess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        .form-input { background-color: #2d3748; border-color: #4a5568; color: #e2e8f0; }
        .form-input:focus { background-color: #1a202c; border-color: #63b3ed; outline: none; box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.5); }
        .btn-primary { background-color: #48bb78; color: #1a202c; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #38a169; }
        .btn-secondary { background-color: #4a5568; color: #e2e8f0; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #2d3748; }
        .card { background-color: #2d3748; border: 1px solid #4a5568; }

        .clock-container {
            background-color: #1a202c;
            border: 2px solid #4a5568;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .clock-container.clock-active {
            border-color: #48bb78;
            box-shadow: 0 0 12px rgba(72, 187, 120, 0.3);
        }
        .clock-container.clock-inactive {
            opacity: 0.55;
            border-color: #4a5568;
            box-shadow: none;
        }
        .clock-container.clock-warning {
            border-color: #ecc94b;
            box-shadow: 0 0 12px rgba(236, 201, 75, 0.3);
            animation: clock-pulse 1s ease-in-out infinite;
        }
        .clock-container.clock-timeout {
            border-color: #f56565;
            box-shadow: 0 0 16px rgba(245, 101, 101, 0.5);
            animation: clock-flash 0.5s ease-in-out infinite;
        }
        @keyframes clock-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes clock-flash {
            0%, 100% { background-color: #1a202c; }
            50% { background-color: #742a2a; }
        }
        .clock-time {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        @media (min-width: 768px) {
            .clock-time { font-size: 2.75rem; }
        }
        .time-control-select {
            background-color: #2d3748;
            border: 1px solid #4a5568;
            color: #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.375rem 0.5rem;
            font-size: 0.875rem;
        }
        .time-control-select:focus { outline: none; border-color: #63b3ed; }
    </style>
</head>
<body class="antialiased min-h-screen">
    <nav class="bg-gray-900 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white tracking-wider">
                <i class="fa-solid fa-chess"></i> CheckMate Web
            </a>
            <div>
                <a href="index.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                    <i class="fa-solid fa-home mr-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-4">
        <div class="flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6 lg:gap-8">

            <!-- Left: Chessboard -->
            <div class="flex flex-col items-center gap-3">
                <div id="chessboard" class="grid grid-cols-8 grid-rows-8 w-full max-w-[340px] sm:max-w-[400px] md:max-w-[500px] lg:max-w-[560px] aspect-square shadow-2xl"></div>
            </div>

            <!-- Right: Clock + Game Info -->
            <div class="w-full lg:w-auto flex flex-col gap-3">

                <!-- Chess Clock -->
                <div class="card p-4 rounded-lg">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-bold border-b border-gray-600 pb-1 flex-1">
                            <i class="fa-solid fa-clock mr-2 text-blue-400"></i>Chess Clock
                        </h2>
                        <select id="time-control-select" class="time-control-select">
                            <option value="1+0">1+0 Bullet</option>
                            <option value="2+1">2+1 Bullet</option>
                            <option value="3+0">3+0 Blitz</option>
                            <option value="3+2">3+2 Blitz</option>
                            <option value="5+0">5+0 Blitz</option>
                            <option value="5+3" selected>5+3 Blitz</option>
                            <option value="10+0">10+0 Rapid</option>
                            <option value="10+5">10+5 Rapid</option>
                            <option value="15+10">15+10 Rapid</option>
                            <option value="30+0">30+0 Classical</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <!-- Black Clock -->
                        <div class="clock-container clock-inactive">
                            <div class="flex items-center justify-between">
                                <span id="label-black" class="text-sm font-semibold text-gray-400 uppercase tracking-wide">
                                    <i class="fa-solid fa-chess-piece mr-1"></i>Black
                                </span>
                                <span id="clock-black" class="clock-time text-gray-300">05:00</span>
                            </div>
                        </div>

                        <!-- White Clock -->
                        <div class="clock-container clock-active">
                            <div class="flex items-center justify-between">
                                <span id="label-white" class="text-sm font-semibold text-green-400 uppercase tracking-wide">
                                    <i class="fa-solid fa-chess-piece mr-1"></i>White
                                </span>
                                <span id="clock-white" class="clock-time text-white">05:00</span>
                            </div>
                        </div>
                    </div>

                    <!-- Clock Controls -->
                    <div class="flex gap-2 mt-3">
                        <button id="pause-btn" class="flex-1 btn-secondary text-sm font-bold py-1.5 px-3 rounded-md hidden">
                            <i class="fa-solid fa-pause mr-1"></i>Pause
                        </button>
                        <button id="resume-btn" class="flex-1 btn-primary text-sm font-bold py-1.5 px-3 rounded-md hidden">
                            <i class="fa-solid fa-play mr-1"></i>Resume
                        </button>
                        <button id="reset-clock-btn" class="flex-1 btn-secondary text-sm font-bold py-1.5 px-3 rounded-md">
                            <i class="fa-solid fa-rotate-left mr-1"></i>Reset Clock
                        </button>
                    </div>
                </div>

                <!-- Game Info -->
                <div class="card p-4 rounded-lg">
                    <h2 class="text-lg font-bold mb-2 border-b border-gray-600 pb-1">
                        <i class="fa-solid fa-gamepad mr-2 text-purple-400"></i>Game Info
                    </h2>
                    <div id="status-area" class="text-lg font-semibold mb-3 p-2 bg-gray-900 rounded-md text-center">White's Turn</div>

                    <div id="game-controls">
                        <button id="new-game-btn" class="w-full btn-primary font-bold py-2 px-4 rounded-md mb-2">
                            <i class="fa-solid fa-plus mr-2"></i>New Game
                        </button>
                        <button id="resign-btn" class="w-full btn-secondary font-bold py-2 px-4 rounded-md">
                            <i class="fa-solid fa-flag mr-2"></i>Resign
                        </button>
                    </div>

                    <div id="game-over-section" class="hidden mt-4 text-center">
                        <h3 class="text-lg font-bold mb-2">Game Over!</h3>
                        <p id="game-result-text" class="mb-3 text-gray-300"></p>
                        <button id="play-again-btn" class="w-full btn-primary font-bold py-2 px-4 rounded-md mb-2">
                            <i class="fa-solid fa-redo mr-2"></i>Play Again
                        </button>
                        <a href="index.html" class="inline-block text-sm text-gray-400 hover:text-white">
                            <i class="fa-solid fa-home mr-1"></i>Back to Menu
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chess-clock.js"></script>
    <script src="js/game-logic.js"></script>
    <script src="js/game-ui.js"></script>
    <script>
        if (!Auth.requireAuth()) throw 'Not logged in';

        document.addEventListener('DOMContentLoaded', () => {
            const gameMode = new URLSearchParams(window.location.search).get('mode') || 'hotseat';
            const gameUI = new GameUI();
            window.gameUIInstance = gameUI;

            if (gameMode === 'ai') {
                const s = document.createElement('script');
                s.src = 'js/game-ai.js';
                s.onload = () => gameUI.initialize(gameMode);
                document.body.appendChild(s);
            } else {
                gameUI.initialize(gameMode);
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            document.body.style.userSelect = 'none';
            document.body.style.webkitUserSelect = 'none';
            window.addEventListener('contextmenu', e => e.preventDefault());

            window.addEventListener('beforeunload', () => {
                if (window.gameUIInstance && window.gameUIInstance.clock) {
                    window.gameUIInstance.clock.saveState();
                }
            });

            window.addEventListener('visibilitychange', () => {
                if (document.hidden && window.gameUIInstance && window.gameUIInstance.clock) {
                    window.gameUIInstance.clock.saveState();
                }
            });
        });
    </script>
</body>
</html>
