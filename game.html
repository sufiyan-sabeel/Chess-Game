<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Chess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        .form-input { background-color: #2d3748; border-color: #4a5568; color: #e2e8f0; }
        .form-input:focus { background-color: #1a202c; border-color: #63b3ed; outline: none; box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.5); }
        .btn-primary { background-color: #48bb78; color: #1a202c; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #38a169; }
        .btn-secondary { background-color: #4a5568; color: #e2e8f0; transition: background-color 0.2s; }
        .btn-secondary:hover { background-color: #2d3748; }
        .card { background-color: #2d3748; border: 1px solid #4a5568; }
    </style>
</head>
<body class="antialiased min-h-screen">
    <nav class="bg-gray-900 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white tracking-wider">
                <i class="fa-solid fa-chess"></i> CheckMate Web
            </a>
            <div>
                <a href="index.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                    <i class="fa-solid fa-home mr-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        <div class="flex flex-col lg:flex-row items-center lg:items-start justify-center gap-8">
            <div id="chessboard" class="grid grid-cols-8 grid-rows-8 w-full max-w-[400px] md:max-w-[600px] aspect-square shadow-2xl"></div>

            <div class="w-full lg:w-1/3 card p-6 rounded-lg">
                <h2 class="text-2xl font-bold mb-4 border-b border-gray-600 pb-2">Game Info</h2>
                <div id="status-area" class="text-xl font-semibold mb-4 p-3 bg-gray-900 rounded-md text-center">White's Turn</div>
                
                <div id="game-controls">
                    <button id="new-game-btn" class="w-full btn-primary font-bold py-2 px-4 rounded-md mb-3">
                        <i class="fa-solid fa-plus mr-2"></i>New Game
                    </button>
                    <button id="resign-btn" class="w-full btn-secondary font-bold py-2 px-4 rounded-md">
                        <i class="fa-solid fa-flag mr-2"></i>Resign
                    </button>
                </div>

                <div id="game-over-section" class="hidden mt-6 text-center">
                    <h3 class="text-lg font-bold mb-3">Game Over!</h3>
                    <p id="game-result-text" class="mb-4 text-gray-300"></p>
                    <button id="play-again-btn" class="w-full btn-primary font-bold py-2 px-4 rounded-md mb-3">
                        <i class="fa-solid fa-redo mr-2"></i>Play Again
                    </button>
                    <a href="index.html" class="inline-block text-sm text-gray-400 hover:text-white">
                        <i class="fa-solid fa-home mr-1"></i>Back to Menu
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/game-logic.js"></script>
    <script src="js/game-ui.js"></script>
    <script>
        if (!Auth.requireAuth()) throw 'Not logged in';

        document.addEventListener('DOMContentLoaded', () => {
            const gameMode = new URLSearchParams(window.location.search).get('mode') || 'hotseat';
            const gameUI = new GameUI();

            if (gameMode === 'ai') {
                const s = document.createElement('script');
                s.src = 'js/game-ai.js';
                s.onload = () => gameUI.initialize(gameMode);
                document.body.appendChild(s);
            } else {
                gameUI.initialize(gameMode);
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            document.body.style.userSelect = 'none';
            document.body.style.webkitUserSelect = 'none';
            window.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body>
</html>
